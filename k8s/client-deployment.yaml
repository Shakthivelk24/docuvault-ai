apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuvault-client
  namespace: docuvault

spec:
  replicas: 1

  selector:
    matchLabels:
      app: docuvault-client

  template:
    metadata:
      labels:
        app: docuvault-client

    spec:
      containers:
        - name: client

          image: 874708626724.dkr.ecr.ap-south-1.amazonaws.com/docuvault-client:IMAGE_TAG

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"

          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20