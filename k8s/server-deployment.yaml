apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuvault-server
  namespace: docuvault

spec:
  replicas: 1

  selector:
    matchLabels:
      app: docuvault-server

  template:
    metadata:
      labels:
        app: docuvault-server

    spec:
      containers:
        - name: server

          image: 874708626724.dkr.ecr.ap-south-1.amazonaws.com/docuvault-server:IMAGE_TAG

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: NODE_ENV
              value: "production"

          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20