
name: Secure DevOps Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================
  # FRONTEND CI
  # ============================================================
  frontend:
    name: Frontend Build & Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build frontend
        run: npm run build

  # ============================================================
  # BACKEND CI
  # ============================================================
  backend:
    name: Backend Build & Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================================
  # SECRET SCANNING
  # ============================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ============================================================
  # STATIC APPLICATION SECURITY TESTING
  # ============================================================
  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/security-audit

  # ============================================================
  # FRONTEND DOCKER BUILD + TRIVY + ECR
  # ============================================================
  docker-client:
    name: Build, Scan & Push Frontend Image
    runs-on: ubuntu-latest

    needs:
      - frontend
      - secret-scan
      - sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            -f docker/frontend/Dockerfile \
            -t docuvault-client:${{ github.sha }} \
            .

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docuvault-client:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::874708626724:role/DocuVaultGitHubActionsECRRole
          aws-region: ap-south-1
          role-session-name: DocuVaultClient-${{ github.run_id }}
          allowed-account-ids: "874708626724"

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push frontend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: docuvault-client
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            docuvault-client:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

  # ============================================================
  # BACKEND DOCKER BUILD + TRIVY + ECR
  # ============================================================
  docker-server:
    name: Build, Scan & Push Backend Image
    runs-on: ubuntu-latest

    needs:
      - backend
      - secret-scan
      - sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -f docker/backend/Dockerfile \
            -t docuvault-server:${{ github.sha }} \
            .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docuvault-server:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::874708626724:role/DocuVaultGitHubActionsECRRole
          aws-region: ap-south-1
          role-session-name: DocuVaultServer-${{ github.run_id }}
          allowed-account-ids: "874708626724"

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push backend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: docuvault-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            docuvault-server:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

  # ============================================================
  # DEPLOY TO AMAZON EKS
  # ============================================================
  deploy-kubernetes:
    name: Deploy DocuVault AI to EKS
    runs-on: ubuntu-latest

    needs:
      - docker-client
      - docker-server

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: docuvault-eks-fixed
      K8S_NAMESPACE: docuvault

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::874708626724:role/DocuVaultGitHubActionsECRRole
          aws-region: ap-south-1
          role-session-name: DocuVaultDeploy-${{ github.run_id }}
          allowed-account-ids: "874708626724"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # IMPORTANT: Establish EKS kubeconfig before running kubectl.
      - name: Configure EKS access
        id: eks-connect
        shell: bash
        run: |
          set -euo pipefail

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      # Never commit Kubernetes secrets to the repository.
      - name: Create or update Kubernetes Secret
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          : "${CLERK_PUBLISHABLE_KEY:?Missing CLERK_PUBLISHABLE_KEY}"
          : "${CLERK_SECRET_KEY:?Missing CLERK_SECRET_KEY}"
          : "${GEMINI_API_KEY:?Missing GEMINI_API_KEY}"

          kubectl create secret generic docuvault-secrets \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" \
            --from-literal=CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Kubernetes image tags
        shell: bash
        run: |
          set -euo pipefail

          sed -i "s|IMAGE_TAG|${GITHUB_SHA}|g" \
            k8s/client-deployment.yaml

          sed -i "s|IMAGE_TAG|${GITHUB_SHA}|g" \
            k8s/server-deployment.yaml

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=server -f k8s/server-deployment.yaml
          kubectl apply --dry-run=server -f k8s/server-service.yaml
          kubectl apply --dry-run=server -f k8s/client-deployment.yaml
          kubectl apply --dry-run=server -f k8s/client-service.yaml

      - name: Deploy backend
        run: |
          kubectl apply -f k8s/server-deployment.yaml
          kubectl apply -f k8s/server-service.yaml

      - name: Deploy frontend
        run: |
          kubectl apply -f k8s/client-deployment.yaml
          kubectl apply -f k8s/client-service.yaml

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/docuvault-server \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/docuvault-client \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

      - name: Show deployment status
        if: always() && steps.eks-connect.outcome == 'success'
        run: |
          kubectl get pods,services -n "$K8S_NAMESPACE"
          kubectl get deployments -n "$K8S_NAMESPACE"
