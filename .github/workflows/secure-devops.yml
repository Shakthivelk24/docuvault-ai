name: Secure DevOps Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


# ============================================================
# GITHUB ACTIONS PERMISSIONS
# ============================================================

permissions:
  contents: read
  id-token: write


jobs:

  # ============================================================
  # FRONTEND CI
  # ============================================================

  frontend:
    name: Frontend Build & Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # Dependency security scan
      # --------------------------------------------------------

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build frontend
        run: npm run build


  # ============================================================
  # BACKEND CI
  # ============================================================

  backend:
    name: Backend Build & Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # Dependency security scan
      # --------------------------------------------------------

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true


  # ============================================================
  # SECRET SCANNING
  # ============================================================

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout full repository history
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # TruffleHog
      # --------------------------------------------------------

      - name: Scan repository for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified


  # ============================================================
  # SAST
  # ============================================================

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Semgrep
      # --------------------------------------------------------

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/security-audit


  # ============================================================
  # FRONTEND DOCKER BUILD + TRIVY + ECR
  # ============================================================

  docker-client:
    name: Build, Scan & Push Frontend Docker Image
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            -f docker/frontend/Dockerfile \
            -t docuvault-client:${{ github.sha }} \
            .


      # --------------------------------------------------------
      # Trivy security scan
      # --------------------------------------------------------

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docuvault-client:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      # ========================================================
      # AWS / ECR
      # These steps run ONLY for pushes to main.
      # ========================================================

      # --------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::874708626724:role/DocuVaultGitHubActionsECRRole
          aws-region: ap-south-1
          role-session-name: DocuVaultClient-${{ github.run_id }}
          allowed-account-ids: 874708626724


      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Tag frontend image
      # --------------------------------------------------------

      - name: Tag frontend image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: docuvault-client
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            docuvault-client:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}


      # --------------------------------------------------------
      # Push frontend image to ECR
      # --------------------------------------------------------

      - name: Push frontend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: docuvault-client
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}


  # ============================================================
  # BACKEND DOCKER BUILD + TRIVY + ECR
  # ============================================================

  docker-server:
    name: Build, Scan & Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            -f docker/backend/Dockerfile \
            -t docuvault-server:${{ github.sha }} \
            .


      # --------------------------------------------------------
      # Trivy security scan
      # --------------------------------------------------------

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docuvault-server:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      # ========================================================
      # AWS / ECR
      # These steps run ONLY for pushes to main.
      # ========================================================

      # --------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::874708626724:role/DocuVaultGitHubActionsECRRole
          aws-region: ap-south-1
          role-session-name: DocuVaultServer-${{ github.run_id }}
          allowed-account-ids: 874708626724


      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Tag backend image
      # --------------------------------------------------------

      - name: Tag backend image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: docuvault-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            docuvault-server:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}


      # --------------------------------------------------------
      # Push backend image to ECR
      # --------------------------------------------------------

      - name: Push backend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: docuvault-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}